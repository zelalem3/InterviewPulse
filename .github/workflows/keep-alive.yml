name: Keep Server Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Runs every 14 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://interviewpulse.onrender.com/api/health
