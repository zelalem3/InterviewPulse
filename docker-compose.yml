version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: interviewpulse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewpulse_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/interviewpulse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewpulse_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  postgres:
    image: postgres:15-alpine
    container_name: interviewpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: interviewpulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: